<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1220;
    --bg-2: #0f1626;
    --panel: #141d33;
    --panel-hover: #19243e;
    --line: #263452;
    --line-strong: #38466a;
    --salmon: #ef8a68;
    --salmon-soft: #f0a889;
    --blue: #7fb0d8;
    --text: #edeff4;
    --text-dim: #808ba5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(239,138,104,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 8%, rgba(127,176,216,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 5.5rem 1.5rem 4rem;
  }

  main { width: 100%; max-width: 900px; }

  /* --- heroo --- */
  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin-bottom: 1.6rem;
  }
  .status .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--salmon);
    box-shadow: 0 0 0 3px rgba(239,138,104,0.18);
  }

  h1 {
    font-size: clamp(2.6rem, 7vw, 3.8rem);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
  }
  h1 .slash { color: var(--salmon); }

  .lede {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.05rem;
    color: var(--text-dim);
    max-width: 46ch;
    line-height: 1.6;
    margin: 0 0 3.5rem;
  }

  /* --- grid --- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.85rem;
    margin-bottom: 1.1rem;
  }
  .section-head h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  .section-head .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
  }

  a.card {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    text-decoration: none;
    color: var(--text);
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.35rem 1.4rem;
    min-height: 96px;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  a.card:nth-child(1) { animation-delay: 0.05s; }
  a.card:nth-child(2) { animation-delay: 0.14s; }
  a.card:nth-child(3) { animation-delay: 0.23s; }
  a.card:nth-child(4) { animation-delay: 0.32s; }

  a.card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(220px 120px at 0% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: -1;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  a.card:hover::after { opacity: 1; }
  a.card:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
  }

  .icon {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 500;
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }

  .body { min-width: 0; }
  .title {
    font-weight: 600;
    font-size: 1.08rem;
    margin: 0 0 0.28rem;
  }
  .desc {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .arrow {
    margin-left: auto;
    flex: none;
    color: var(--text-dim);
    transition: transform 0.18s ease, color 0.18s ease;
  }
  a.card:hover .arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  footer {
    margin-top: 3.5rem;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-top: 1px solid var(--line);
    padding-top: 1.2rem;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    a.card { animation: none; opacity: 1; transform: none; }
    a.card, .arrow { transition: none; }
  }
</style>
</head>
<body>
<main>

  <p class="status"><span class="led"></span> 3 projects online</p>
  <h1>home<span class="slash">/</span>neks</h1>


  <div class="section-head">
    <h2>Projects</h2>
    <span class="count">03</span>
  </div>

  <div class="grid">
    <a class="card" style="--accent:#ef8a68" href="https://desktop-kh8k5ie.walrus-armadillo.ts.net/" target="_blank" rel="noopener">
      <div class="icon">H</div>
      <div class="body">
        <p class="title">H.E.C.T.O.R</p>
        <p class="desc">Personal AI workspace — chat, server management, monitoring</p>
      </div>
      <span class="arrow">→</span>
    </a>

    <a class="card" style="--accent:#7fb0d8" href="https://neks-git.github.io/Neks-L4-s/" target="_blank" rel="noopener">
      <div class="icon">L4</div>
      <div class="body">
        <p class="title">L4 Mission Guide</p>
        <p class="desc">EVE Online mission tactics, tank notes, loot and ammo</p>
      </div>
      <span class="arrow">→</span>
    </a>

    <a class="card" style="--accent:#ef8a68" href="https://github.com/Neks-Git" target="_blank" rel="noopener">
      <div class="icon">{ }</div>
      <div class="body">
        <p class="title">GitHub</p>
        <p class="desc">Source code and other projects</p>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>
    <span>&copy; 2026 Neks</span>
    <span>Finland</span>
  </footer>

</main>
</body>
</html>
